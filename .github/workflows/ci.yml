name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - run: python manage.py check --settings=config.settings.production
      - env:
          SECRET_KEY: ci-test-secret-key-not-for-production
          USE_SQLITE: 'true'
        run: python manage.py migrate --noinput

  dashboard:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: front-end/school-dashboard
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: front-end/school-dashboard/package-lock.json
      - run: npm ci
      - run: npm run build
        env:
          VITE_API_URL: http://localhost/api/v1
          VITE_SHOW_DEMO: 'false'

  website:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: front-end/school-website
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: front-end/school-website/package-lock.json
      - run: npm ci
      - run: npm run build
        env:
          VITE_API_URL: http://localhost/api/v1
