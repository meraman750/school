# Production stack — no published DB/Redis ports, no backend source bind mount.
# Usage:
#   cp .env.production.example .env
#   # edit .env
#   docker compose -f docker-compose.prod.yml --env-file .env up --build -d

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${DB_NAME:-biruk_academy}
      POSTGRES_USER: ${DB_USER:-biruk}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${DB_USER:-biruk} -d ${DB_NAME:-biruk_academy}']
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    command: gunicorn config.wsgi:application --bind 0.0.0.0:8000 --workers 3 --timeout 120
    env_file:
      - .env
    environment:
      USE_SQLITE: 'false'
      DEBUG: 'False'
      DB_HOST: db
      DB_PORT: '5432'
      DB_NAME: ${DB_NAME:-biruk_academy}
      DB_USER: ${DB_USER:-biruk}
      DB_PASSWORD: ${DB_PASSWORD}
      REDIS_URL: redis://redis:6379/1
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0
    volumes:
      - media_files:/app/media
      - static_files:/app/staticfiles
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  celery:
    build:
      context: ./backend
      dockerfile: Dockerfile
    command: celery -A config worker -l info
    env_file:
      - .env
    environment:
      USE_SQLITE: 'false'
      DEBUG: 'False'
      DB_HOST: db
      REDIS_URL: redis://redis:6379/1
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0
    depends_on:
      - backend
      - redis
    restart: unless-stopped

  celery-beat:
    build:
      context: ./backend
      dockerfile: Dockerfile
    command: celery -A config beat -l info
    env_file:
      - .env
    environment:
      USE_SQLITE: 'false'
      DEBUG: 'False'
      DB_HOST: db
      REDIS_URL: redis://redis:6379/1
      CELERY_BROKER_URL: redis://redis:6379/0
    depends_on:
      - celery
    restart: unless-stopped

  website:
    build:
      context: ./front-end/school-website
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL:-http://localhost/api/v1}
    restart: unless-stopped

  dashboard:
    build:
      context: ./front-end/school-dashboard
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL:-http://localhost/api/v1}
        VITE_SHOW_DEMO: ${VITE_SHOW_DEMO:-false}
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    ports:
      - '80:80'
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - media_files:/var/www/media:ro
      - static_files:/var/www/static:ro
    depends_on:
      - backend
      - website
      - dashboard
    restart: unless-stopped

volumes:
  postgres_data:
  media_files:
  static_files:
